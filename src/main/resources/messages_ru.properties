# Russian messages for limine-snapper-sync.
# Placeholders {0}, {1}, ... are filled in at runtime and must stay in the translation.
# A literal apostrophe has to be doubled ('') in a text that has placeholders.
# Technology and standard names stay in Latin: Limine, Snapper, Btrfs, UEFI, ESP, systemd.
# Russian needs three plural forms, so plural.forms is one-few-many.
# The prompt answers (prompt.restore, prompt.list, prompt.select, prompt.cancel) are matched
# against what the user types and stay in Latin on purpose: a system that boots from a
# snapshot can end up on a console with no Cyrillic keymap.
# The label.* entries are padded to 18 characters by the printer, so they have to stay short.

